name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p oxide-cli

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          package="oxide-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp target/release/oxide "dist/$package/oxide"
          cp LICENSE README.md "dist/$package/"
          cp examples/oxide.toml "dist/$package/oxide.example.toml"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          shasum -a 256 "dist/$package.tar.gz" > "dist/$package.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: oxide-${{ matrix.target }}
          path: |
            dist/oxide-${{ matrix.target }}.tar.gz
            dist/oxide-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
